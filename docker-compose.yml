services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_api
      POSTGRES_USER: core_api
      POSTGRES_PASSWORD: core_api
    ports:
      - "5432:5432"
    volumes:
      - core-api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_api -d core_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: core_api
      DB_USER: core_api
      DB_PASSWORD: core_api
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  core-api-postgres-data:
